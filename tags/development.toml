[programs.gh]
brew = "gh"

# The tailscaled daemon. Neither manager has a package by that name: the tailscale package ships
# tailscaled and the CLI. macOS takes the brew formula; Linux takes apt from Tailscale's own
# repository, which loadout adds on a machine that lacks the package (needs apply --elevated).
# A machine that already has it, or already has the repo, is left alone. apt turns on
# tailscaled.service itself; on a fresh Mac, start the daemon once with
# `sudo brew services start tailscale`.
[programs.tailscaled]
brew = "tailscale"
apt = "tailscale"
apt-repo = { url = "https://pkgs.tailscale.com/stable/ubuntu", key = "https://pkgs.tailscale.com/stable/ubuntu/{codename}.noarmor.gpg" }

[programs.neovim]
brew = "neovim"

[programs.tmux]
brew = "tmux"

[programs.fzf]
brew = "fzf"

[programs.jq]
brew = "jq"

[programs.ripgrep]
brew = "ripgrep"

[programs.coreutils]
brew = "coreutils"

[programs.procs]
brew = "procs"

[programs.go-task]
brew = "go-task"

[programs.tlrc]
brew = "tlrc"

[programs.ffmpeg]
brew = "ffmpeg"

[programs.worktrunk]
brew = "worktrunk"

[programs.rustup]
brew = "rustup"

[programs.uv]
brew = "uv"

[programs.mise]
brew = "mise"

[programs.bun]
brew = "oven-sh/bun/bun"

[programs.pnpm]
brew = "pnpm"

# npm comes from node, so on a fresh machine the npm programs install on the sync after the one
# that installs node.
[programs.node]
brew = "node"

# Homebrew ships these two as casks only, which do not exist on Linux; npm covers Linux.
[programs.claude-code]
cask = "claude-code"
npm = "@anthropic-ai/claude-code"

[programs.codex]
cask = "codex"
npm = "@openai/codex"

# T3 Code's nightly channel, from its GitHub releases on macOS and Linux. Loadout installs each
# once; both update themselves on the nightly channel after that.
# The desktop app: ~/Applications on macOS, an AppImage in ~/.local/bin on Linux.
[programs.t3-code]
github = { repo = "pingdotgg/t3code", tag = "v*-nightly.*", prerelease = true, app = "T3 Code (Nightly)", asset = { macos-aarch64 = "T3-Code-*-arm64.zip", macos-x86_64 = "T3-Code-*-x64.zip", linux-x86_64 = "T3-Code-*-x86_64.AppImage", linux-aarch64 = "T3-Code-*-arm64.AppImage" } }

# The T3 Code server CLI, linked into ~/.local/bin. `t3 service install` and `t3 connect` are
# one-time manual steps. T3 publishes no Intel macOS build of it.
[programs.t3]
github = { repo = "pingdotgg/t3code", tag = "v*-nightly.*", prerelease = true, bin = "t3", asset = { macos-aarch64 = "t3-*-darwin-arm64.tar.gz", linux-x86_64 = "t3-*-linux-x64.tar.gz", linux-aarch64 = "t3-*-linux-arm64.tar.gz" } }

# Use the existing npm installation on Linux; Homebrew on macOS.
[programs.agent-browser]
brew = "agent-browser"
when = { os = "macos" }

[programs.agent-browser-linux]
npm = "agent-browser"
when = { os = "linux", arch = "x86_64" }

[files.agent-browser-personal]
source = "files/agent-browser/agent-browser-personal"
target = "~/.local/bin/agent-browser-personal"
when = { os = ["linux", "macos"] }

[files.agent-browser-personal-setup]
source = "files/agent-browser/agent-browser-personal-setup"
target = "~/.local/bin/agent-browser-personal-setup"
when = { os = ["linux", "macos"] }

[files.agent-browser-personal-config]
source = "files/agent-browser/config.json"
target = "~/.config/agent-browser-personal/config.json"
when = { os = ["linux", "macos"] }

[programs.bitwarden-cli]
brew = "bitwarden-cli"
when = { os = ["linux", "macos"] }

[programs.bitwarden-mcp]
npm = "@bitwarden/mcp-server"
when = { os = ["linux", "macos"] }

[files.bitwarden-local]
source = "files/bitwarden/bitwarden-local"
target = "~/.local/bin/bitwarden-local"
when = { os = ["linux", "macos"] }

[files.bitwarden-local-launcher]
source = "files/bitwarden/launcher.mjs"
target = "~/.local/lib/loadout/bitwarden/launcher.mjs"
when = { os = ["linux", "macos"] }

[mcp.bitwarden]
command = "/bin/sh"
args = ["-c", 'exec "$HOME/.local/bin/bitwarden-local" mcp']
when = { os = ["linux", "macos"] }

[skills.personal-vaultwarden]
source = "skills/personal-vaultwarden"

[files.agent-browser-dashboard-service]
source = "files/agent-browser/agent-browser-dashboard.service"
target = "~/.config/systemd/user/agent-browser-dashboard.service"
when = { os = "linux", arch = "x86_64" }

[files.agent-browser-dashboard-access]
source = "files/agent-browser/access.conf"
target = "~/.config/systemd/user/agent-browser-dashboard.service.d/access.conf"
when = { os = "linux", arch = "x86_64" }
