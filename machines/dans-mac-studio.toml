[programs.parsec]
cask = "parsec"

[programs.betterdisplay]
cask = "betterdisplay"

# The T3 Code server CLI. npm comes from node, so on a fresh machine t3 installs on the sync after
# the one that installs node. `t3 service install` and `t3 connect` are one-time manual steps.
[programs.node]
brew = "node"

[programs.t3]
npm = "t3"
