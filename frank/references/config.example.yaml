# Frank's settings, Synara edition. /frank setup copies this to the Hub document frank/config.yaml (Hub coordinator)
# or ~/.bob-n-frank/synara/config.yaml (standalone) and Frank reads it every run.
# A repo can override its own entries in <repo>/.bob-n-frank/synara/config.yaml (tracker, slack channels, never_paths).

timezone: America/Chicago

briefs:
  times: ["08:30", "16:30"]
  weekdays: [1, 2, 3, 4, 5]        # 0 is Sunday

sweep:                              # blocker and inbox check between briefs
  every_hours: 2
  hours: ["08:30", "18:30"]          # sweeps outside this window do nothing
  weekdays: [1, 2, 3, 4, 5]

# Repos Frank watches and may send Bob into.
repos: []
#  - path: ~/Developer/acme/app
#    github: acme/app

# auto: use when this session can reach it. on: expected, say so when it's missing. off: never read.
sources:
  synara_threads: on
  github: auto
  linear: auto
  slack: auto
  email: off
  calendar: off

tracker: auto                       # linear when connected, else github issues

slack:
  channels: []                      # channel names or ids to triage

auto_dispatch:
  small_bugs: true                  # confirmed, contained bugs go straight to a Bob thread
  per_run: 3                        # at most this many per brief or sweep
  never_paths: []                   # globs never auto-dispatched, on top of auth, money, data, migrations

in_flight_cap: 4                    # Bob threads Frank keeps queued or running at once; never above the Hub's maxConcurrentWorkers
stalled_after_hours: 24             # dispatched work with no new commit, PR change, or progress step this long gets flagged

# Filled in by /frank setup.
thread_id: null
hub_project_id: null                # null when Frank runs standalone
automations: []                     # ids of Frank's brief and sweep automations
